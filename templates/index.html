<!DOCTYPE html>
<html>
<head>
  <title>Student Support Chatbot</title>
  <style>
    body { font-family: Arial; background: #eef2f7; display: flex; justify-content: center; }
    .box { width: 400px; background: white; margin-top: 40px; border-radius: 10px; box-shadow: 0 0 10px #aaa; }
    h2 { background: #2b6cb0; color: white; margin: 0; padding: 15px; border-radius: 10px 10px 0 0; text-align: center; }
    #chat { height: 350px; overflow-y: auto; padding: 10px; }
    .user { text-align: right; color: #1a365d; margin: 8px; }
    .bot { text-align: left; color: #2f855a; margin: 8px; white-space: pre-wrap; }
    .input-area { display: flex; border-top: 1px solid #ccc; }
    input { flex: 1; padding: 12px; border: none; outline: none; }
    button { padding: 12px 20px; background: #2b6cb0; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Student Support Chatbot</h2>
    <div id="chat"><div class="bot">Bot: Namaste! Aap kya poochna chahte hain?</div></div>
    <div class="input-area">
      <input id="msg" placeholder="Apna sawal likhein..." onkeypress="if(event.key==='Enter') send()">
      <button onclick="send()">Send</button>
    </div>
  </div>

  <script>
    async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;
  const chat = document.getElementById("chat");
  chat.innerHTML += `<div class="user">You: ${text}</div>`;
  input.value = "";
  try {
    const res = await fetch("/get", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text})
    });
    const data = await res.json();
    chat.innerHTML += `<div class="bot">Bot: ${data.reply}</div>`;
  } catch (e) {
    chat.innerHTML += `<div class="bot">Bot: Server se jawab nahi mila. Terminal me error check karein.</div>`;
  }
  chat.scrollTop = chat.scrollHeight;
}
  </script>
</body>
</html>
